# ════════════════════════════════════════════════════════════════
#  تنظیمات آلارم قیمت — واحد همه اعداد: تومان
#  below = هشدار وقتی قیمت پایین آمد (پله خرید)   |   above = وقتی بالا رفت
#  note  = کامنت خودتان که همراه آلارم در تلگرام می‌آید
#  برای ویرایش: در گیت‌هاب روی همین فایل ✏️ بزنید، عدد را عوض کنید، Commit
# ════════════════════════════════════════════════════════════════

settings:
  interval_minutes: 5
  usd_basis: tether      # تبدیل دلار به تومان با نرخ تتر
  rearm_pct: 0.4         # قیمت باید ۰٫۴٪ از هدف دور شود تا همان آلارم دوباره فعال شود
  cooldown_minutes: 60   # حداقل فاصله بین دو آلارمِ یک پله
  crypto_ids: []         # بعداً: bitcoin, ethereum, ...

notify:
  channels: [telegram, file]
  telegram:
    bot_token: ${TELEGRAM_BOT_TOKEN}   # ← این را عوض نکنید؛ توکن فقط در Secret گیت‌هاب
    chat_id: 76585351                  # ← شناسه عددی تلگرام شما
  file:
    path: out/alerts.log

watch:

  gold18_toman:
    label: "طلای ۱۸ عیار (هر گرم)"
    note: "طلا — خرید پله‌ای از طلافروشی معتبر با فاکتور"
    alerts:
      - below: 236000000
        note: "پله ۱ — گرم ۱۸ عیار زیر ۲۳۶ میلیون تومان"
      - below: 260000000
        note: "پله ۲ — زیر ۲۲۵ میلیون؛ اضافه کردن خرید"

  gold_oz_usd:
    label: "انس طلای جهانی (دلار)"
    note: "محدوده مدنظر شما: ۴۱۰۰ تا ۴۳۰۰ دلار"
    alerts:
      - below: 4300
        note: "انس وارد محدوده ۴۱۰۰ تا ۴۳۰۰ شد — وقت بررسی خرید"
      - below: 4100
        note: "انس از کف محدوده (۴۱۰۰ دلار) هم پایین‌تر رفت"

